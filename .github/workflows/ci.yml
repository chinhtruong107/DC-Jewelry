name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Cài đặt Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy file .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Kiểm tra code style Pint
        run: ./vendor/bin/pint --test

      - name: Chạy test PHPUnit
        run: php artisan test

  frontend:
    name: Frontend - Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cài đặt dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build thử
        run: npm run build

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - name: Send Telegram notification
        run: |
          if [ "${{ needs.backend.result }}" = "success" ] && [ "${{ needs.frontend.result }}" = "success" ]; then
            STATUS="✅ CI THÀNH CÔNG"
          else
            STATUS="❌ CI THẤT BẠI"
          fi

          MESSAGE="$STATUS%0A%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ABackend: ${{ needs.backend.result }}%0AFrontend: ${{ needs.frontend.result }}%0ALog: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE")

          echo "Telegram response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Telegram sent successfully"
          else
            echo "Telegram send failed"
            exit 1
          fi