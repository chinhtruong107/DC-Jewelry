name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare environment
        run: cp .env.example .env
      - name: Generate application key
        run: php artisan key:generate
      - name: Check code style with Pint
        run: ./vendor/bin/pint --test
      - name: Run PHPUnit tests
        run: php artisan test

  frontend:
    name: Frontend - Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Build application
        run: npm run build

  notify-ci:
    name: Notify CI Result
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    continue-on-error: true
    steps:
      - name: Send CI notification to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          if [ "$BACKEND_RESULT" = "success" ] && [ "$FRONTEND_RESULT" = "success" ]; then
            STATUS="CI SUCCESS"
          else
            STATUS="CI FAILED"
          fi
          MESSAGE="$STATUS

          Repo: $REPOSITORY
          Branch: $BRANCH
          Backend: $BACKEND_RESULT
          Frontend: $FRONTEND_RESULT

          Log: https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
          curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

  deploy:
    name: Deploy via Ansible Control Node
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          CONTROL_NODE_SSH_KEY: ${{ secrets.CONTROL_NODE_SSH_KEY }}
          CONTROL_NODE_HOST: ${{ secrets.CONTROL_NODE_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CONTROL_NODE_SSH_KEY" > ~/.ssh/control-node-key
          chmod 600 ~/.ssh/control-node-key
          ssh-keyscan -H "$CONTROL_NODE_HOST" >> ~/.ssh/known_hosts

      - name: Run deployment on Control Node
        env:
          CONTROL_NODE_HOST: ${{ secrets.CONTROL_NODE_HOST }}
          CONTROL_NODE_USER: ${{ secrets.CONTROL_NODE_USER }}
        run: |
          ssh \
            -i ~/.ssh/control-node-key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$CONTROL_NODE_USER@$CONTROL_NODE_HOST" \
            'cd /home/ubuntu/ansible-jewelry && ./scripts/deploy.sh'
