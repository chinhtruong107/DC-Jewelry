name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare environment
        run: cp .env.example .env
      - name: Generate application key
        run: php artisan key:generate
      - name: Check code style with Pint
        run: ./vendor/bin/pint --test
      - name: Run PHPUnit tests
        run: php artisan test

  frontend:
    name: Frontend - Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Build application
        run: npm run build

  notify-ci:
    name: Notify CI Result
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    continue-on-error: true
    steps:
      - name: Send CI notification to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          if [ "$BACKEND_RESULT" = "success" ] && [ "$FRONTEND_RESULT" = "success" ]; then
            STATUS="CI SUCCESS"
          else
            STATUS="CI FAILED"
          fi
          MESSAGE="$STATUS

          Repo: $REPOSITORY
          Branch: $BRANCH
          Backend: $BACKEND_RESULT
          Frontend: $FRONTEND_RESULT

          Log: https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
          curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

  build-images:
    name: Build and Publish Images
    runs-on: ubuntu-latest
    needs: [backend, frontend, notify-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Define immutable image tag
        id: release
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build and push Laravel image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dc-jewelry-backend:${{ steps.release.outputs.image_tag }}
      - name: Build and push Next.js image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dc-jewelry-frontend:${{ steps.release.outputs.image_tag }}

  deploy-k3s:
    name: Deploy Release to K3s
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          CONTROL_NODE_SSH_KEY: ${{ secrets.CONTROL_NODE_SSH_KEY }}
          CONTROL_NODE_HOST: ${{ secrets.CONTROL_NODE_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CONTROL_NODE_SSH_KEY" > ~/.ssh/control-node-key
          chmod 600 ~/.ssh/control-node-key
          ssh-keyscan -H "$CONTROL_NODE_HOST" >> ~/.ssh/known_hosts
      - name: Run the Platform release script on the Control Node
        env:
          CONTROL_NODE_HOST: ${{ secrets.CONTROL_NODE_HOST }}
          CONTROL_NODE_USER: ${{ secrets.CONTROL_NODE_USER }}
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
          K3S_OVERLAY: ${{ vars.K3S_OVERLAY || 'aws-domain' }}
          K3S_PLATFORM_DIR: ${{ vars.K3S_PLATFORM_DIR || '/home/ubuntu/dc-jewelry-k3s-platform' }}
        run: |
          ssh \
            -i ~/.ssh/control-node-key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$CONTROL_NODE_USER@$CONTROL_NODE_HOST" \
            "cd '$K3S_PLATFORM_DIR' && BACKEND_IMAGE_TAG='$IMAGE_TAG' FRONTEND_IMAGE_TAG='$IMAGE_TAG' ./scripts/deploy.sh '$K3S_OVERLAY'"

  notify-deploy:
    name: Notify Deploy Result
    runs-on: ubuntu-latest
    needs: [backend, frontend, build-images, deploy-k3s]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
      - name: Send deploy notification to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_RESULT: ${{ needs.deploy-k3s.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS="DEPLOY SUCCESS"
          else
            STATUS="DEPLOY FAILED"
          fi

          MESSAGE="$STATUS

          Repo: $REPOSITORY
          Branch: $BRANCH
          Commit: $SHORT_SHA
          Actor: $ACTOR
          Deploy: $DEPLOY_RESULT

          Website: https://dcjewelry.duckdns.org
          Log: https://github.com/$REPOSITORY/actions/runs/$RUN_ID"

          curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
