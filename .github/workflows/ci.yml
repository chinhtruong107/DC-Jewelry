name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Cài đặt Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy file .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Kiểm tra code style Pint
        run: ./vendor/bin/pint --test

      - name: Chạy test PHPUnit
        run: php artisan test

  frontend:
    name: Frontend - Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cài đặt dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Build thử
        run: npm run build

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTROL_NODE_SSH_KEY }}" > ~/.ssh/control.pem
          chmod 600 ~/.ssh/control.pem

          ssh-keyscan -H ${{ secrets.CONTROL_NODE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via Ansible Control Node
        run: |
          ssh -i ~/.ssh/control.pem \
            ${{ secrets.CONTROL_NODE_USER }}@${{ secrets.CONTROL_NODE_HOST }} \
            "cd /home/ubuntu/ansible-jewelry && \
             git pull origin main && \
             chmod +x scripts/deploy.sh && \
             ./scripts/deploy.sh"

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [backend, frontend, deploy]
    if: always()

    steps:
      - name: Send Telegram notification
        run: |
          if [ "${{ needs.backend.result }}" = "success" ] && \
             [ "${{ needs.frontend.result }}" = "success" ] && \
             { [ "${{ needs.deploy.result }}" = "success" ] || [ "${{ needs.deploy.result }}" = "skipped" ]; }; then
            STATUS="✅ CI/CD THÀNH CÔNG"
          else
            STATUS="❌ CI/CD THẤT BẠI"
          fi

          MESSAGE="$STATUS%0A%0A\
Repo: ${{ github.repository }}%0A\
Branch: ${{ github.ref_name }}%0A\
Backend: ${{ needs.backend.result }}%0A\
Frontend: ${{ needs.frontend.result }}%0A\
Deploy: ${{ needs.deploy.result }}%0A%0A\
Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE")

          echo "Telegram response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Telegram sent successfully"
          else
            echo "Telegram send failed"
            exit 1
          fi